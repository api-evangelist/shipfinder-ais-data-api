source: https://docs.shipfinder.com/llms.txt
surface: webhooks
summary: ShipFinder ships a push (webhook) event surface as dataset 7, the Event Dataset. The subscriber configures
  a receiving URL in the console (or per geofence zone), binds vessels to a monitored fleet or geofence, and ShipFinder
  POSTs JSON to that URL. Seven event types are documented, each with a published payload schema. All push services
  are premium and require per-key permission enablement. No signature, replay-protection or retry policy is documented.
security:
  signature: null
  retries: null
  replay_protection: null
  evidence: The documentation describes no webhook signing header, no retry/backoff policy and no delivery-acknowledgement
    contract.
event_count: 7
events:

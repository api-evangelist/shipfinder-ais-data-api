model: per-key quota, negotiated per service; not numerically published
summary: ShipFinder does not publish numeric rate limits. Every dataset carries a "Request Limits" statement saying
  calls are subject to quota restrictions according to the permission type attached to the API key, with the actual
  figures visible only in the console or via the support team. Vessel Search is the single endpoint documented as
  having no frequency limit once access is granted. Exhaustion is signalled in the response envelope, not in headers.
headers: null
in_band_codes:
- status: 12
  meaning: Request data volume exceeds limit, execution rejected
- status: 15
  meaning: Multi-vessel request quantity exceeds limit
- status: 22
  meaning: Vessel query quantity exceeds limit
- status: 23
  meaning: Vessel query frequency exceeds limit
- status: 25
  meaning: Vessel archive query quantity exceeds limit
- status: 26
  meaning: Vessel current status query quantity exceeds limit
- status: 28
  meaning: Track query time exceeds limit
- status: 29
  meaning: Request frequency too high, please try again later
- status: 30
  meaning: Request parameter exceeds limit
default_data_windows:
- scope: Vessel history track
  window: latest month by default; longer periods on request
- scope: Port call records
  window: latest month by default; 6/12 months or longer on request

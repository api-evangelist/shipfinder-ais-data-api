                        stay_time:
                          type: number
                          description: Continuous dwell time of the vessel at the current port, measured in minutes.
                        arrival_time:
                          type: integer
                          description: Vessel arrival time in Unix timestamp
                      required:
                      - mmsi
                      - imo
                      - call_sign

  /v1/Voyage/PortAnchoredVessels:
    get:
      summary: 2.3 Currently Anchored Vessels
      deprecated: false
      description: '## Description


        The Currently Anchored Vessels retrieves information of all vessels currently at the port anchorage using the port’s five-digit port code. Returned data includes the total count of vessels waiting at the port anchorage, vessel type, basic vessel details, port arrival time and vessel dwell time.


        ## Use Cases


        1. Analyze the average patterns of vessel operation duration based on the dwell time of different vessel types in the returned dataset.

        2. For logistic operations, filter vessels by type from the list of currently berthed vessels to identify suitable carriers for cargo transportation.

        3. For vessel bunkering and marine equipment upgrade scenarios, obtain the list of in-port vessels first, then query vessel profiles to check equipment and other details, so as to identify targets eligible for bunkering services or equipment upgrade recommendations.


        ## Request Limits


        An API key must be created before using this service. API calls are subject to quota restrictions according to your permission type. To view your current service access permissions, please contact our support team: support@elaneglobal.com.


        ## Endpoint

        | Endpoint | HTTP Method |

        |----------|-------------|

        | `https://api.elaneglobal.com/v1/Voyage/PortAnchoredVessels` | GET |


        ## Example API Call


        https://api.elaneglobal.com/v1/Voyage/PortAnchoredVessels?key=1F6D701272402D1E7D8D316CCE519123&port_code=CNSHG


        **Note:**


        The key 1F6D701272402D1E7D8D316CCE519123 is the official key of Shipfinder.com, bound to the domain api.shipfinder.com.

        Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        To trial the service, please create your own key in the Dashboard.'
      tags:
      - 2 Voyage Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: port_code
        in: query
        description: Standard five-digit port code
        required: true
        example: CNSHG
        schema:
          type: string
      - name: ship_type
        in: query
        description: 'Filter the type of vessels: see Appendix for details. All vessels will be returned if this parameter is not specified.'
        required: false
        schema:
          type: integer
      - name: search_type
        in: query
        description: 'Query filtering type:

          1=Exclude vessels that have not reported AIS data for an extended period; 0=Return all vessels.

          Note: Vessels with modified MMSI numbers may show as staying within the port boundary for a prolonged duration. This parameter can be used to filter out such vessels.'
        required: false
        schema:
          type: integer
      responses:

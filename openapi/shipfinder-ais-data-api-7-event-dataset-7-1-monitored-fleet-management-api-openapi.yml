  /v1/Event/DeleteFleet:
    post:
      summary: 7.1.4 Delete Fleet
      deprecated: false
      description: '**Endpoint**

        | Endpoint | HTTP Method |

        | --- | --- |

        |`https://api.elaneglobal.com/v1/Event/DeleteFleet` | Post |


        **Example API Call**


        https://api.elaneglobal.com/v1/Event/DeleteFleet?key=1F6D701272402D1E7D8D316CCE519123&fleet_id=3f2062c6-b796-4a03-b923-48628794dd86


        **Note:**

        - The key `1F6D701272402D1E7D8D316CCE519123` is the official key of Shipfinder.com, bound to the domain api.shipfinder.com.

        - Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        - To trial the service, please create your own key in the Dashboard. New users receive a complimentary usage quota upon API key creation.


        **Note:**

        After a fleet is deleted, all related push services will stop including data from this fleet, including: fleet vessel queries, real-time position push, arrival/departure event push, ETA push, and AIS event push. If no other fleets remain bound to the push service, no further messages will be pushed.

        The geofence alert push follows a different logic: if the bound fleet is deleted, the system will push alerts for all vessels entering or exiting the geofence. To modify geofence alerts, you must bind a new fleet or set new filters. To disable geofence alerts entirely, you must delete the geofence.'
      tags:
      - 7 Event Dataset/7.1 Monitored Fleet Management
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:

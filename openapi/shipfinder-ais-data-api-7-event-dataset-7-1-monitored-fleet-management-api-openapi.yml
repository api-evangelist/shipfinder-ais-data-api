- name: 7 Event Dataset/7.1 Monitored Fleet Management
paths:
  /v1/Event/AddFleet:
    post:
      summary: 7.1.1 Create Fleet
      deprecated: false
      description: '**Endpoint**

        | Endpoint | HTTP Method |

        | --- | --- |

        | `https://api.elaneglobal.com/v1/Event/AddFleet` | Post |


        **Example API Call**


        https://api.elaneglobal.com/v1/Event/AddFleet?key=1F6D701272402D1E7D8D316CCE519123&fleet_name=myfleet123&mmsis=477985700,412751690&monitor=6


        **Note:**

        - The key `1F6D701272402D1E7D8D316CCE519123` is the official key of Shipfinder.com, bound to the domain api.shipfinder.com.

        - Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        - To trial the service, please create your own key in the Dashboard.


        Note:

        Each monitoring type selected in the monitor field requires corresponding permissions to be enabled first.If you lack the required permissions, the system will return:"You do not have access permission".

        If your services are already activated but the number of monitored vessels exceeds your permitted quota, the system will return:"The number of queryable vessels exceeds the limit".

        You may check your current permission quota in the Permission section of the dashboard. To upgrade your services or expand your vessel monitoring quota, please contact our support team.'
      tags:
      - 7 Event Dataset/7.1 Monitored Fleet Management
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Your personal Shipfinderer API key to verify service permissions.
                fleet_name:
                  type: string
                  description: Unique identifier for the fleet, used for subsequent maintenance of fleet information.
                mmsis:
                  type: string
                  description: Add vessels to the fleet. Enter multiple MMSI numbers separated by commas.
                monitor:
                  type: string
                  description: 'Specifies the monitoring content for the fleet.

                    1 = Fleet Vessel Query

                    2 = Real-time Vessel Position Push

                    3 = Vessel Arrival/Departure Event Push

                    4 = Dynamic ETA Push

                    5 = AIS Abnormal Event Push

                    6 = Geofence Monitoring Push

                    7 = Vessel Alongside Event Push

                    Separate multiple values by commas.'
              required:
              - key
              - fleet_name
              - mmsis
              - monitor
              x-apifox-orders:
              - key
              - fleet_name
              - mmsis
              - monitor
              - 01KMD0YYBXC401EWT6S1717M4X
            example:
              key: 1F6D701272402D1E7D8D316CCE519123
              fleet_name: myfleet123
              mmsis: 477985700,412751690
              monitor: '6'
      responses:
        '0':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      fleet_id:
                        type: string
                        description: Unique identifier for the fleet, used for subsequent maintenance of fleet information.
                      fleet_name:
                        type: string
                        description: Add vessels to the fleet. Enter multiple MMSI numbers separated by commas.
                      mmsis:
                        type: string
                        description: Vessels MMSIs to be managed under the fleet.
                      monitor:
                        type: string
                        description: Monitored content associated with the fleet; can be modified via the Update Fleet Information API or the Dashboard.
                    required:
                    - fleet_id
                    - fleet_name
                    - mmsis
                    - monitor
                    x-apifox-orders:
                    - fleet_id
                    - fleet_name
                    - mmsis
                    - monitor
                required:
                - status
                - msg
                - data
                x-apifox-orders:
                - status
                - msg
                - data
              example:
                status: 0
                msg: ''
                data:
                  fleet_id: 3f2062c6-b796-4a03-b923-48628794dd86
                  fleet_name: 自有船队在途监控
                  mmsis: 412751690,477985700
                  monitor: '6'
          headers: {}
          x-apifox-name: success
      security: []
      x-apifox-folder: 7 Event Dataset/7.1 Monitored Fleet Management
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/7948067/apis/api-432035260-run

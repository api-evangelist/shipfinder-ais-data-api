  /v1/AIS/VesselsInZone:
    get:
      summary: 1.4 Vessels in Zone
      deprecated: false
      description: "## Description\nThe Vessels in Zone retrieves all AIS data of vessels within a specified geographic area in a single request. You may pass multiple latitude and longitude coordinates to define a custom polygonal search area.\n\nThe recommended area size for a single request is within 1°×1° to ensure full data return in one call; otherwise, you will need to make multiple requests with the scode token to fetch all vessel data in the target area.\n\nThe JSON format returns approximately 2,600 vessel records per response, while the binary format returns around 8,000 records. For large search areas, you may split the area into smaller subareas and request data sequentially, and use the scode token to retrieve remaining vessel data iteratively.\n\nWe also provide customized push services for Vessels in Zone, supporting integration via TCP/IP or Kafka. Please contact our support team for more information: support@elaneglobal.com\n\n## Use Cases\n1. **Customs and Border Inspection Area Monitoring**  \n   Monitor all vessels in coastal or key designated areas, track the vessel watchlist, and oversee vessel operating behaviors.\n2. **Port Vessel Density Analysis**  \n   Define a zone near the port to capture all vessel information within the scope, filter vessels by category and destination port data, and analyze the vessel distribution density around the port.\n3. **Logistics Vessel Matching**  \n   Specify a zone around the departure port/warehouse, filter information and destination ports of all cargo vessels, and generate a shortlist of qualified cargo vessels by combining vessel profile queries, historical behavior, ETA and other datasets.\n\n## Request Limits\nAn API key must be created before using this service. API calls are subject to quota restrictions according to your permission type. To view your current service access permissions, please contact our support team: support@elaneglobal.com. \n\n\n## Endpoint\n| Endpoint | HTTP Method | Remarks |\n|----------|-------------|---------|\n|  `https://api.elaneglobal.com/v1/AIS/VesselsInZone`  | GET | Vessels that have not reported AIS data for more than 2 hours will be excluded from the area-based search results, as their presence in the target area cannot be verified.TCP/IP custom push services can be customized to your actual needs, supporting multiple filtering rules: designated geographic area, vessel type/length, and custom dedicated fleet lists. Push frequency and returned data fields can also be defined as required. |\n\n## Example API call\nhttps://api.elaneglobal.com/v1/AIS/VesselsInZone?key=1F6D701272402D1E7D8D316CCE519123&region=121.289063,35.424868-122.783203,35.281501-122.167969,33.979809&output=1\n\n\n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to the domain api.elaneglobal.com.\nUsers are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.\nTo trial the service, please contact our support team: support@elaneglobal.com. "
      tags:
      - AIS Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: region
        in: query
        description: "Geographic area defined by coordinates. Longitude and latitude are separated by a comma; multiple coordinate points are separated by a hyphen. \nExample: lng,lat-lng,lat-lng,lat-lng,lat\nNote: \n1. Multiple coordinate points must be listed sequentially in clockwise or counterclockwise order.\n2. A minimum of 3 coordinate points is required; 2 points only form a straight line and cannot define a closed geographic area.\n3. Longitude must be entered before latitude for every coordinate pair.\n4. The queried geographic area shall not exceed the assigned permission scope.\n5. Within the authorized scope, users may split the target area into multiple smaller subareas to request data based on actual business scenarios."
        required: true
        example: 121.289063,35.424868-122.783203,35.281501-122.167969,33.979809
        schema:
          type: string
      - name: output
        in: query
        description: 'Data output format selector: 0 = Binary data encoded in Base64 1 = JSON format Default value: 1'
        required: false
        example: 1
        schema:
          type: integer
      - name: scode
        in: query
        description: "Session token for area-based vessel query . Used to retrieve remaining vessel data when the full dataset cannot be returned in a single request due to an oversized search area.\nNote: \n1. A single HTTP request returns a maximum of 2,666 vessel records. Use the scode returned from the initial query to fetch remaining data. The query region must remain unchanged; otherwise, a new query session will be generated.\n2. Check the continue field in the response. A value of 0 indicates all vessel data in the target area has been fully retrieved, and no additional requests are needed."
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success. HTTP 200 with a JSON envelope whose "status" field is 0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: API call status code,0 means success
                  msg:
                    type: string
                    description: Exception prompt message
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: "Number of vessel records returned in the current request only; does not represent the total number of vessels in the target area. \nFor large areas requiring multiple requests with the scode token, sum the total values of all requests to get the full vessel count of the area."
                      scode:
                        type: integer
                        description: Session token for paginated data retrieval. If the full vessel data of the area cannot be returned in a single request, use the scode returned from the initial request to fetch the remaining vessel records until full data is obtained.
                      continue:
                        type: integer
                        description: 'Flag indicating whether all vessel data in the area has been fully returned:

                          0= All data returned (query completed)

                          1= Partial data remaining (query not completed, continue requesting with scode)'
                      ship_list:
                        type: array
                        items:
                          type: object
                          properties:
                            mmsi:
                              type: integer
                              description: 9-digit numeric code of MMSI
                            imo:

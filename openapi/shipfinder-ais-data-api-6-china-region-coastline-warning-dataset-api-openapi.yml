                      - range_points
                      - pub_time
                      - content
                      - range_type
                      - expire_time
                      x-apifox-orders:
                      - warning_type
                      - source
                      - title
                      - range_type
                      - range_points
                      - expire_time
                      - pub_time
                      - content
                    description: Navigation warning information

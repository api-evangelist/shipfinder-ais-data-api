info:
  title: ShipFinder Global Maritime Data 5 Meteorology Dataset API
  description: Verbatim assembly of the per-endpoint OpenAPI 3.0.1 fragments ShipFinder publishes on docs.shipfinder.com (one fragment per endpoint page, indexed by the provider llms.txt). Path items are reproduced exactly as published; only the enclosing document (info/servers/tags) is API Evangelist assembly. No operation content was altered.
  version: 1.0.0
servers: []
tags:
- name: 5 Meteorology Dataset
paths:
  /v1/Meteorology/MarineWeather:
    get:
      summary: 5.3 Global Marine Weather
      deprecated: false
      description: '## Description

        The Global Marine Weather queries global marine meteorological data by geographic coordinates, covering core navigation-critical weather indicators including sea level pressure, pressure-driven current direction, wind direction, wind speed, significant wave height, visibility, etc.


        Note: Meteorological monitoring data is incomplete in certain regions. A return value of -32767 for fields such as barometric pressure and swell height indicates no valid meteorological readings are available for the queried location.


        ## Use Cases

        1. **Route Planning & Optimization**

        Dynamic Route Adjustment: Retrieve real-time marine meteorological data during vessel transit. In the event of sudden severe weather or fluctuating meteorological conditions, adjust the sailing route promptly to avoid navigational hazards and guarantee maritime safety.

        2. **Vessel Navigation Safety**

        - Severe Weather Warning: Obtain advance forecasts of hazardous marine weather including tropical cyclones, storm surges, cold wave gales, and sea fog. Vessels may implement preemptive measures (e.g., altering course, adjusting speed, seeking a lee anchorage) to reduce sailing risks in adverse weather and lower accident probability.

        - Visibility Monitoring & Early Warning: Low-visibility events (e.g., sea fog) severely impact navigation safety. Visibility data from marine weather outputs enables vessels to assess visibility conditions in surrounding waters and deploy contingency measures in advance.

        3. **Port Operations & Management**

        Vessel Port Entry/Exit Scheduling: Port authorities may optimize vessel arrival/departure timetables based on marine meteorological data, suspending berthing/unberthing operations during severe weather to ensure the safety and efficiency of port activities.

        4. **Vessel Insurance Pricing & Risk Assessment**

        Risk Quantification: By analyzing historical marine meteorological data combined with vessel type, planned route, and sailing season, insurers can accurately quantify risk exposure under varying meteorological conditions and formulate rational premium rates.

        5. **Vessel Entry Risk Assessment for Border Inspection & Customs**

        - Adverse Weather Impact Evaluation: Border inspection and customs authorities review marine meteorological data along the vessel’s transit path to verify exposure to severe weather, and assess potential damages including hull structural impairment and cargo loss.

        - Sailing Trajectory Analysis: Correlate marine meteorological data with the vessel’s sailing trajectory to verify route compliance and identify abnormal detours or idle periods. Vessels with anomalous trajectories inconsistent with prevailing meteorological conditions shall undergo targeted inspection to deter illicit trade, smuggling, stowaway trafficking and other illegal activities.


        ## Request Limits

        - This is a premium service that requires advanced permission application prior to use.

        - An API key must be created in the Dashboard before using this service.

        - Service calls are subject to quota restrictions according to your permission type; your current service access permissions can be viewed in the Dashboard.

        - Please contact our support team to activate service permissions.


        ## Endpoint

        | Endpoint | HTTP Method |

        | --- | --- |

        | `https://api.elaneglobal.com/v1/Meteorology/MarineWeather ` | Get |


        ## Example API Call

        https://api.elaneglobal.com/v1/Meteorology/MarineWeather?key=1F6D701272402D1E7D8D316CCE519123&lng=123.58414&lat=27.37979


        **Note:**

        The key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to the domain api.elaneglobal.com.

        Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        To trial the service, please contact our support team: support@elaneglobal.com.'
      tags:
      - 5 Meteorology Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: lng
        in: query
        description: Coordinate longitude, WGS84 coordinate system
        required: true
        example: 123.58414
        schema:
          type: number
      - name: lat
        in: query
        description: Coordinate latitude, WGS84 coordinate system
        required: true
        example: 27.37979
        schema:
          type: number
      - name: weather_time
        in: query
        description: 'UTC time in Unix timestamp format. When this parameter is not specified, the latest available meteorological data will be returned.

          Note: Only forecast data for the following fixed UTC hours daily is queryable within the next 7 days: 02:00:00, 08:00:00, 14:00:00, 20:00:00.'
        required: false
        schema:
          type: string
      responses:
        '0':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Descriptive status of the data query result
                  msg:
                    type: string
                    description: System response status code; refer to the Appendix for return code definitions
                  data:
                    type: object
                    properties:
                      bm500:
                        type: number
                        description: 500mb elevation pressure, unit (gpm), when the return value is -32767, it indicates that there is no corresponding data returned here.
                      humidity:
                        type: number
                        description: 'Relative humidity, Unit: %'
                      oceandir:
                        type: number
                        description: 'Ocean current direction, Unit: degrees (°)'
                      oceanspeed:
                        type: number
                        description: 'Ocean current speed, Unit: meters per second (m/s)'
                      pressure:
                        type: number
                        description: 'Sea level barometric pressure, Unit: hectopascals (hPa)'
                      swelldir:
                        type: number
                        description: 'Swell propagation direction, Unit: degrees (°)'
                      swellheight:
                        type: number
                        description: 'Significant swell height, Unit: meters (m)'
                      swellperiod:
                        type: number
                        description: 'Swell wave period, Unit: seconds (s)'
                      temperature:
                        type: number
                        description: 'Sea surface temperature (SST), Unit: degrees Celsius (℃)'
                      visibility:
                        type: number
                        description: 'Horizontal atmospheric visibility, Unit: meters (m)'
                      waveheight:
                        type: number
                        description: 'Significant total wave height (wind wave + swell), Unit: meters (m)'
                      winddir:
                        type: number
                        description: 'Surface wind direction, Unit: degrees (°)'
                      windspeed:
                        type: number
                        description: 'Surface wind speed, Unit: meters per second (m/s)'
                      publish_time:
                        type: integer
                        description: Timestamp of the meteorological forecast issuance
                      lng:
                        type: number
                        description: Longitude of the forecast grid point
                      lat:
                        type: number
                        description: Latitude of the forecast grid point
                    required:
                    - bm500
                    - humidity
                    - oceandir
                    - oceanspeed
                    - pressure
                    - swelldir
                    - swellheight
                    - swellperiod
                    - temperature
                    - visibility
                    - waveheight
                    - winddir
                    - windspeed
                    - publish_time
                    - lng
                    - lat
                    x-apifox-orders:
                    - bm500
                    - humidity
                    - oceandir
                    - oceanspeed
                    - pressure
                    - swelldir
                    - swellheight
                    - swellperiod
                    - temperature
                    - visibility
                    - waveheight
                    - winddir
                    - windspeed
                    - publish_time
                    - lng
                    - lat
                required:
                - status
                - msg
                - data
                x-apifox-orders:
                - status
                - msg
                - data
              example:
                status: 0
                msg: ''
                data:
                  bm500: -32767
                  humidity: 93.5
                  oceandir: 234
                  oceanspeed: 0.2
                  pressure: 1008.5
                  swelldir: 158.7
                  swellheight: 2
                  swellperiod: 5.8
                  temperature: 24.5
                  visibility: 24134.8
                  waveheight: 2
                  winddir: 183.2
                  windspeed: 10.1
                  publish_time: 1746748800
                  lng: 123.58414
                  lat: 27.37979
          headers: {}
          x-apifox-name: success
      security: []
      x-apifox-folder: 5 Meteorology Dataset
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/7948067/apis/api-431272522-run
      operationId: getV1MeteorologyMarineWeather
      x-operation-id-source: derived

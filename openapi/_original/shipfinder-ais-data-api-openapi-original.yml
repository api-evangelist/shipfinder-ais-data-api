  /v1/AIS/VesselFlagInfo:
    get:
      summary: 1.5 Vessel Flag Information
      deprecated: false
      description: "## Description\nThe Vessel Flag Information queries the flag state (country/region) information\
        \ of the matching vessel by the vessel’s MMSI number.\n\n## Use Case\n### Maritime Supervision\nUsing the\
        \ vessel MMSI numbers obtained from area-based vessel search results or port berthing vessel lists, this\
        \ service quickly matches the country/region of registration for the target vessels. It supports analysis\
        \ of the proportion and operational behaviors of foreign vessels within the port or specific designated\
        \ maritime areas.\n\n## Request Limits\nAn API key must be created before using this service. API calls\
        \ are subject to quota restrictions according to your permission type. To view your current service access\
        \ permissions, please contact our support team: support@elaneglobal.com. \n\n## Endpoint\n| Endpoint | HTTP\
        \ Method |\n|----------|-------------|\n| `https://api.elaneglobal.com/v1/AIS/VesselFlagInfo` | GET |\n\n\
        ## Example API Call\nhttps://api.elaneglobal.com/v1/AIS/VesselFlagInfo?key=1F6D701272402D1E7D8D316CCE519123&mmsi=477172700\n\
        \n\n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound\
        \ to the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing\
        \ it will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "
      tags:
      - 1 AIS Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: mmsi
        in: query
        description: 9-digit numeric code of MMSI
        required: true
        example: 477172700
        schema:
          type: integer
      responses:
        '0':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: API call status code,0 means success
                  msg:
                    type: string
                    description: Exception prompt message
                  data:
                    type: object
                    properties:
                      mmsi:
                        type: integer
                        description: 9-digit numeric code of MMSI
                      registry:
                        type: string
                        description: Name of the vessel’s flag state (country/region)
                    required:
                    - mmsi
                    - registry
                    x-apifox-orders:
                    - mmsi
                    - registry
                required:
                - status
                - msg
                - data
                x-apifox-orders:
                - status
                - msg
                - data
              example:
                status: 0
                msg: ''
                data:
                  mmsi: 477172700
                  registry: Panama
          headers: {}
          x-apifox-name: success
      security: []
      x-apifox-folder: 1 AIS Dataset
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/7948067/apis/api-429919472-run

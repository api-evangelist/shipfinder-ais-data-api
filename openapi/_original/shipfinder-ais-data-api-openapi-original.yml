  /v1/History/PortCallRecordsByPort:
    get:
      summary: 3.6 Port Calls Records for Port
      deprecated: false
      description: "## Description\n\nThis Port Calls Records for Port service retrieves all vessels that have called\
        \ at a port within a specified time frame by the port’s 5-digit port code. Returned data includes vessel\
        \ basic details, port call records at the target port, and the corresponding previous/next port of call\
        \ records for each vessel.\n\n## Use Cases\n\n1. **Logistics Tracking**  \n   Query and analyze the number\
        \ of calling vessels, their berth distribution and port call time windows at a port during a specified period.\
        \ Filter and aggregate the average vessel waiting time and operating time by vessel category, and estimate\
        \ vessel queuing time at the port as a reference for overall voyage timeline calculation.\n\n2. **Port Analytics**\n\
        \n## Request Limits\n\nAn API key must be created before using this service. \nService calls are subject\
        \ to quota restrictions according to your permission type.\nThis service queries port call records within\
        \ the latest month by default. To view your current service access permissions or enable the query for port\
        \ call records covering 6 months, 12 months or a longer period, please contact our support team: support@elaneglobal.com.\
        \ \n\n## Endpoint\n\n| Endpoint | HTTP Method |\n|----------|-------------|\n| `https://api.elaneglobal.com/v1/History/PortCallRecordsByPort`\
        \  | GET |\n\n## Example API Call\n\n[https://api.elaneglobal.com/v1/History/PortCallRecordsByPort?key=1F6D701272402D1E7D8D316CCE519123&port_code=CNSHG&start_time=1744467589&end_time=1744967589]\n\
        \n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to\
        \ the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing it\
        \ will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "
      tags:
      - 3 History Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: port_code
        in: query

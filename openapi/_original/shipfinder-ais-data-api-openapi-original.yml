        \ the paired vessel, as well as the STS position, coordinates, start time and end time of the event.\n\n\
        ## Applicable Scenarios\n**Freight Logistics**\n1. **Normal STS Transshipment**  \n   Monitor the cargo\
        \ transfer flow where large vessels transship cargo to small crafts via STS operations. Track and analyze\
        \ each phase of cargo circulation by combining the small craft details and their subsequent port berthing\
        \ records.\n2. **Cargo Theft Monitoring**  \n   For non-transshipment scenarios, STS events detected during\
        \ vessel navigation will trigger key monitoring for potential cargo theft. Determine whether small crafts\
        \ are involved in cargo theft at the time of the STS event by integrating CCTV and other monitoring tools.\n\
        \n**Maritime Supervision**\n- **Vessel Behavior Analysis**  \n  Maritime regulatory authorities can use\
        \ vessel STS records to analyze vessel behavior patterns, and identify unauthorized STS operations as abnormal\
        \ behaviors by combining other comprehensive datasets.\n\n## Request Limits\nThis is a premium service that\

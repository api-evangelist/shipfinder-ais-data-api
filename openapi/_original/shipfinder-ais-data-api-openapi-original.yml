        \ call sign, vessel name , vessel type, length and breadth. It also contains the latest real time AIS updates:\
        \ vessel position, navigation status, destination port, speed over ground, estimated time of arrival at\
        \ the destination port, vessel heading, course over ground and other standard AIS parameters.\n\n## Use\
        \ Cases\n1. **Offshore Construction Safety Monitoring**  \n   Centered on construction vessels, the service\
        \ returns a list of vessels within a 10 nautical mile radius to monitor their positions and trajectories.\
        \ If any vessel approaches the construction zone, the construction team can issue timely warnings or adjust\
        \ construction plans accordingly.\n\n2. **Maritime Collision Avoidance Early Warning**  \n   Centered on\
        \ underway vessels, the service monitors the positions and courses of nearby vessels to assess collision\
        \ risks. If potential collision risks are detected, the vessel operator can implement immediate collision\
        \ avoidance maneuvers.\n\n3. **Maritime Emergency Search and Rescue**  \n   Centered on distressed vessels,\
        \ the service locates and coordinates nearby vessels to conduct search and rescue (SAR) operations.\n\n\

  /v1/Prediction/RoutePlanPointToPoint:
    get:
      summary: 4.1 Point-to-Point Route Planning
      deprecated: false
      description: "# 4.1 Point-to-Point Route Planning\n\n## Description\nThe Point-to-Point Route Planning queries\
        \ the route plan between two coordinate waypoints, or from a departure waypoint to a destination port. Returns\
        \ the total nautical distance of the route and the latitude/longitude coordinates of all waypoints along\
        \ the route.\n\n## Use Cases\n1. **Logistics Tracking**  \n   Save the planned fixed route and match it\
        \ against the vessel’s real-time position to monitor whether the vessel sails in compliance with the predefined\
        \ route. Route deviation alerts can be triggered by calculating the distance between the vessel’s real-time\
        \ position and the planned path. You may also overlay historical vessel tracks with the planned route to\
        \ visualize and compare discrepancies between the actual voyage track and the planned path.\n\n2. **Navigation\
        \ Guidance**  \n   During vessel transit, retrieve the recommended sailing route in real time based on the\
        \ vessel’s current position and destination port. The route can be combined with meteorological data for\
        \ adverse weather avoidance, or used to plot simulated future sailing routes on electronic charts.\n\n##\
        \ Request Limits\nAn API key must be created before using this service. API calls are subject to quota restrictions\
        \ according to your permission type. To view your current service access permissions, please contact our\
        \ support team: support@elaneglobal.com. \n\n## Endpoint\n| Endpoint | HTTP Method |\n| --- | --- |\n| `https://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint`\
        \  | GET |\n\n## Example API Call\nhttps://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint?key=1F6D701272402D1E7D8D316CCE519123&start_point=113.571144,22.844316&end_point=121.58414,31.37979\n\
        \nhttps://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint?key=1F6D701272402D1E7D8D316CCE519123&start_point=113.571144,22.844316&end_port_code=CNQDG\n\
        \n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to\
        \ the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing it\
        \ will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "

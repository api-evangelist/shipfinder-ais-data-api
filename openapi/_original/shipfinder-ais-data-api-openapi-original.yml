    get:
      summary: 2.3 Currently Anchored Vessels
      deprecated: false
      description: "## Description\n\nThe Currently Anchored Vessels retrieves information of all vessels currently\
        \ at the port anchorage using the port’s five-digit port code. Returned data includes the total count of\
        \ vessels waiting at the port anchorage, vessel type, basic vessel details, port arrival time and vessel\
        \ dwell time.\n\n## Use Cases\n\n1. Analyze the average patterns of vessel operation duration based on the\
        \ dwell time of different vessel types in the returned dataset.\n2. For logistic operations, filter vessels\
        \ by type from the list of currently berthed vessels to identify suitable carriers for cargo transportation.\n\
        3. For vessel bunkering and marine equipment upgrade scenarios, obtain the list of in-port vessels first,\
        \ then query vessel profiles to check equipment and other details, so as to identify targets eligible for\
        \ bunkering services or equipment upgrade recommendations.\n\n## Request Limits\n\nAn API key must be created\
        \ before using this service. API calls are subject to quota restrictions according to your permission type.\
        \ To view your current service access permissions, please contact our support team: support@elaneglobal.com.\

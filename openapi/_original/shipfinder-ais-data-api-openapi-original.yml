          1'
        required: false
        example: 1
        schema:
          type: integer
      - name: scode
        in: query
        description: "Session token for area-based vessel query . Used to retrieve remaining vessel data when the\
          \ full dataset cannot be returned in a single request due to an oversized search area.\nNote: \n1. A single\

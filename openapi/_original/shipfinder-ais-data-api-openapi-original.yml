  /v1/Meteorology/MarineWeather:
    get:
      summary: 5.3 Global Marine Weather
      deprecated: false
      description: "## Description\nThe Global Marine Weather queries global marine meteorological data by geographic\
        \ coordinates, covering core navigation-critical weather indicators including sea level pressure, pressure-driven\
        \ current direction, wind direction, wind speed, significant wave height, visibility, etc.\n\nNote: Meteorological\
        \ monitoring data is incomplete in certain regions. A return value of -32767 for fields such as barometric\
        \ pressure and swell height indicates no valid meteorological readings are available for the queried location.\n\
        \n## Use Cases\n1. **Route Planning & Optimization**  \n   Dynamic Route Adjustment: Retrieve real-time\
        \ marine meteorological data during vessel transit. In the event of sudden severe weather or fluctuating\
        \ meteorological conditions, adjust the sailing route promptly to avoid navigational hazards and guarantee\
        \ maritime safety.\n2. **Vessel Navigation Safety**  \n   - Severe Weather Warning: Obtain advance forecasts\
        \ of hazardous marine weather including tropical cyclones, storm surges, cold wave gales, and sea fog. Vessels\
        \ may implement preemptive measures (e.g., altering course, adjusting speed, seeking a lee anchorage) to\
        \ reduce sailing risks in adverse weather and lower accident probability.\n   - Visibility Monitoring &\
        \ Early Warning: Low-visibility events (e.g., sea fog) severely impact navigation safety. Visibility data\
        \ from marine weather outputs enables vessels to assess visibility conditions in surrounding waters and\
        \ deploy contingency measures in advance.\n3. **Port Operations & Management**  \n   Vessel Port Entry/Exit\
        \ Scheduling: Port authorities may optimize vessel arrival/departure timetables based on marine meteorological\
        \ data, suspending berthing/unberthing operations during severe weather to ensure the safety and efficiency\
        \ of port activities.\n4. **Vessel Insurance Pricing & Risk Assessment**  \n   Risk Quantification: By analyzing\
        \ historical marine meteorological data combined with vessel type, planned route, and sailing season, insurers\
        \ can accurately quantify risk exposure under varying meteorological conditions and formulate rational premium\
        \ rates.\n5. **Vessel Entry Risk Assessment for Border Inspection & Customs**  \n   - Adverse Weather Impact\
        \ Evaluation: Border inspection and customs authorities review marine meteorological data along the vessel’s\
        \ transit path to verify exposure to severe weather, and assess potential damages including hull structural\
        \ impairment and cargo loss.\n   - Sailing Trajectory Analysis: Correlate marine meteorological data with\
        \ the vessel’s sailing trajectory to verify route compliance and identify abnormal detours or idle periods.\
        \ Vessels with anomalous trajectories inconsistent with prevailing meteorological conditions shall undergo\
        \ targeted inspection to deter illicit trade, smuggling, stowaway trafficking and other illegal activities.\n\
        \n## Request Limits\n- This is a premium service that requires advanced permission application prior to\
        \ use.\n- An API key must be created in the Dashboard before using this service.\n- Service calls are subject\
        \ to quota restrictions according to your permission type; your current service access permissions can be\
        \ viewed in the Dashboard.\n- Please contact our support team to activate service permissions.\n\n## Endpoint\n\
        | Endpoint | HTTP Method |\n| --- | --- |\n| `https://api.elaneglobal.com/v1/Meteorology/MarineWeather `\
        \ | Get |\n\n## Example API Call\nhttps://api.elaneglobal.com/v1/Meteorology/MarineWeather?key=1F6D701272402D1E7D8D316CCE519123&lng=123.58414&lat=27.37979\n\
        \n\n**Note:**\nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to\
        \ the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing it\
        \ will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. \n"
      tags:
      - 5 Meteorology Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123

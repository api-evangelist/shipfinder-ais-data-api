  /v1/AIS/VesselsInZone:
    get:
      summary: 1.4 Vessels in Zone
      deprecated: false
      description: "## Description\nThe Vessels in Zone retrieves all AIS data of vessels within a specified geographic\
        \ area in a single request. You may pass multiple latitude and longitude coordinates to define a custom\
        \ polygonal search area.\n\nThe recommended area size for a single request is within 1°×1° to ensure full\
        \ data return in one call; otherwise, you will need to make multiple requests with the scode token to fetch\
        \ all vessel data in the target area.\n\nThe JSON format returns approximately 2,600 vessel records per\
        \ response, while the binary format returns around 8,000 records. For large search areas, you may split\
        \ the area into smaller subareas and request data sequentially, and use the scode token to retrieve remaining\
        \ vessel data iteratively.\n\nWe also provide customized push services for Vessels in Zone, supporting integration\
        \ via TCP/IP or Kafka. Please contact our support team for more information: support@elaneglobal.com\n\n\
        ## Use Cases\n1. **Customs and Border Inspection Area Monitoring**  \n   Monitor all vessels in coastal\
        \ or key designated areas, track the vessel watchlist, and oversee vessel operating behaviors.\n2. **Port\
        \ Vessel Density Analysis**  \n   Define a zone near the port to capture all vessel information within the\
        \ scope, filter vessels by category and destination port data, and analyze the vessel distribution density\
        \ around the port.\n3. **Logistics Vessel Matching**  \n   Specify a zone around the departure port/warehouse,\
        \ filter information and destination ports of all cargo vessels, and generate a shortlist of qualified cargo\
        \ vessels by combining vessel profile queries, historical behavior, ETA and other datasets.\n\n## Request\
        \ Limits\nAn API key must be created before using this service. API calls are subject to quota restrictions\
        \ according to your permission type. To view your current service access permissions, please contact our\
        \ support team: support@elaneglobal.com. \n\n\n## Endpoint\n| Endpoint | HTTP Method | Remarks |\n|----------|-------------|---------|\n\
        |  `https://api.elaneglobal.com/v1/AIS/VesselsInZone`  | GET | Vessels that have not reported AIS data for\
        \ more than 2 hours will be excluded from the area-based search results, as their presence in the target\
        \ area cannot be verified.TCP/IP custom push services can be customized to your actual needs, supporting\
        \ multiple filtering rules: designated geographic area, vessel type/length, and custom dedicated fleet lists.\
        \ Push frequency and returned data fields can also be defined as required. |\n\n## Example API call\nhttps://api.elaneglobal.com/v1/AIS/VesselsInZone?key=1F6D701272402D1E7D8D316CCE519123&region=121.289063,35.424868-122.783203,35.281501-122.167969,33.979809&output=1\n\
        \n\n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound\
        \ to the domain api.elaneglobal.com.\nUsers are not authorized to use this key for data access—utilizing\
        \ it will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "

  /v1/Warning/NavigationalWarnings:
    get:
      summary: 6.1 China Region Navigational Warnings
      deprecated: false
      description: "## Description\nThe China Region Navigational Warnings is used to query navigation warning data\
        \ in China’s coastal areas, including military operations, vessel drills, live-fire exercises, vessel operations,\
        \ buoy dynamics, vessel grounding, vessel sea trials, shipwrecks, casualties, construction operations and\
        \ other events.\nThe data is sourced from the China Maritime Safety Administration (MSA).\n\n## Use Cases\n\
        **Vessel Navigation Safety**\n- **Hazard Area Avoidance**\n  Navigation warning data helps vessels stay\
        \ away from dangerous zones, such as military exercise areas, shipwreck areas, sand mining operation areas,\
        \ etc.\n  For example, when the maritime authority issues a navigation warning for military exercises in\
        \ a certain sea area, vessels can adjust their routes according to the data to avoid entering the zone,\
        \ thus reducing risks such as collisions and accidental intrusion into hazardous areas.\n\n**Port Management**\n\
        - **Port Operation Optimization**\n  Port authorities can use navigation warning data to grasp the dynamics\
        \ of incoming vessels in advance and arrange port operations reasonably, including berth allocation, pilotage\
        \ services, etc.\n- **Port Safety Assurance**\n  Timely access to navigation warnings around ports helps\
        \ port authorities monitor navigation safety in surrounding waters and prevent accidents such as vessel\
        \ collisions and groundings.\n\n**Maritime Big Data Analysis**\n- **Risk Assessment**\n  Shipping companies\
        \ can conduct risk assessments using navigation warning data, analyze the risk level of specific routes\
        \ or areas, and provide a basis for insurance pricing and risk management.\n\n## Request Limits\nThis is\
        \ a premium service that requires advanced permission application prior to use.\nAn API key must be created\
        \ before using this service. The corresponding monitored fleet vessels and push receiving URL must be configured\
        \ under the API key.\n To view your current service access permissions, please contact our support team:\
        \ support@elaneglobal.com. \n\n## Endpoint\n| Endpoint | HTTP Method |\n|----------|-------------|\n| `https://api.elaneglobal.com/v1/Warning/NavigationalWarnings`\
        \ | GET |\n\n## Example API Call\nhttps://api.elaneglobal.com/v1/Warning/NavigationalWarnings?key=1F6D701272402D1E7D8D316CCE519123&start_time=2024-07-21%2020:00&end_time=2024-09-21%2020:00\n\
        \n\n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound\
        \ to the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing\
        \ it will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "

  /v1/Prediction/ETA:
    get:
      summary: 4.3 ETA Query
      deprecated: false
      description: "## Description\nQuery the berthing information of the vessel at the departure port, the actual\
        \ departure time, as well as the total voyage, the distance already traveled, and the Estimated Time of\
        \ Arrival to the next destination port.\n\n## Use Case\n**Logistics Tracking**  \nQuery the berthing time\
        \ and departure time of the vessel at the departure port, as well as the Estimated Time of Arrival at the\
        \ destination port. By coordinating with vessel berthing records or vessel arrival and departure event notifications,\
        \ it is possible to track the arrival and departure times, berthing terminal information, and sailing status\
        \ of each voyage of the vessel.\n\n## Request Limits\nAn API key must be created before using this service.\
        \ API calls are subject to quota restrictions according to your permission type. To view your current service\
        \ access permissions, please contact our support team: support@elaneglobal.com. \n\n## Endpoint\n| Endpoint\
        \ | HTTP Method |\n|----------|-------------|\n| `https://api.elaneglobal.com/v1/Prediction/ETA` | GET |\n\
        \n## Example API Call\nhttps://api.elaneglobal.com/v1/Prediction/ETA?key=1F6D701272402D1E7D8D316CCE519123&mmsi=477172700&port_code=CNSHG&speed=20\n\
        \n\n**Note:**  \nThe key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound\
        \ to the domain api.elaneglobal.com. \nUsers are not authorized to use this key for data access—utilizing\
        \ it will return a status code 14, indicating an error in the source domain.\nTo trial the service, please\
        \ contact our support team: support@elaneglobal.com. "
      tags:
      - 4 Prediction Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: mmsi
        in: query
        description: 9-digit numeric code of MMSI
        required: true
        example: 477172700
        schema:
          type: integer
      - name: port_code
        in: query
        description: 'Standard 5-digit port code.

          When this parameter is not specified, the endpoint defaults to the next destination port declared in the
          vessel’s AIS message.'
        required: false
        example: CNSHG
        schema:
          type: string
      - name: speed
        in: query
        description: 'Sustained speed for the subsequent voyage, unit: knots (kn).

          When this parameter is not specified, , ETA is calculated using the vessel’s average sailing speed over
          the latest month (the average excludes speed data recorded while the vessel was at anchor in port areas).'
        required: false
        example: 20
        schema:
          type: number

  /v1/History/PortCallRecordsByVessel:
    get:
      summary: 3.3 Vessel Port Call History
      deprecated: false
      description: "## Description\nThe Vessel Port Call History queries a vessel’s historical port call records\
        \ within a specified time period. It returns the vessel’s anchorage arrival time, port limits arrival time,\
        \ berthing time, port dwell time, inbound and outbound draft conditions, and other relevant details.\n\n\
        ## Use Cases\n1. **Maritime Supervision**  \n   Analyze whether foreign vessels have berthed at high-risk\
        \ ports based on historical berthing records, and verify the authenticity and accuracy of entry declaration\
        \ information.\n\n2. **Logistics Tracking**  \n   Track vessel voyage information, settle freight and trace\
        \ logistics records based on actual port call times and voyage durations, and verify cargo loading/unloading\
        \ activities by changes in vessel draft.\n\n3. **Financial & Insurance**  \n   Compare and verify port call\
        \ records and draft change records for each vessel voyage against shipping order data, to conduct vessel\
        \ risk assessment and analysis.\n\n## Request Limits\nAn API key must be created before using this service.\
        \ \nService calls are subject to quota restrictions according to your permission type.\nThis service queries\
        \ port call records within the latest month by default. To view your current service access permissions\
        \ or enable the query for port call records covering 6 months, 12 months or a longer period, please contact\
        \ our support team: support@elaneglobal.com. \n\n## Endpoint\n| Endpoint | HTTP Method |\n| --- | --- |\n\
        |  `https://api.elaneglobal.com/v1/History/PortCallRecordsByVessel` | GET |\n\n## Example API Call\nhttps://api.elaneglobal.com/v1/History/PortCallRecordsByVessel?key=1F6D701272402D1E7D8D316CCE519123&mmsi=477172700&start_time=1744967589&end_time=1745572389\n\

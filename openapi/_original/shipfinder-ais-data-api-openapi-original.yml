      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: region
        in: query
        description: "Geographic area defined by coordinates. Longitude and latitude are separated by a comma; multiple\
          \ coordinate points are separated by a hyphen. \nExample: lng,lat-lng,lat-lng,lat-lng,lat\nNote: \n1.\
          \ Multiple coordinate points must be listed sequentially in clockwise or counterclockwise order.\n2. A\
          \ minimum of 3 coordinate points is required; 2 points only form a straight line and cannot define a closed\
          \ geographic area.\n3. Longitude must be entered before latitude for every coordinate pair.\n4. The queried\
          \ geographic area shall not exceed the assigned permission scope.\n5. Within the authorized scope, users\
          \ may split the target area into multiple smaller subareas to request data based on actual business scenarios."
        required: true
        example: 121.289063,35.424868-122.783203,35.281501-122.167969,33.979809
        schema:

info:
  title: ShipFinder Global Maritime Data 4 Prediction Dataset API
  description: Verbatim assembly of the per-endpoint OpenAPI 3.0.1 fragments ShipFinder publishes on docs.shipfinder.com (one fragment per endpoint page, indexed by the provider llms.txt). Path items are reproduced exactly as published; only the enclosing document (info/servers/tags) is API Evangelist assembly. No operation content was altered.
  version: 1.0.0
servers: []
tags:
- name: 4 Prediction Dataset
paths:
  /v1/Prediction/ETA:
    get:
      summary: 4.3 ETA Query
      deprecated: false
      description: '## Description

        Query the berthing information of the vessel at the departure port, the actual departure time, as well as the total voyage, the distance already traveled, and the Estimated Time of Arrival to the next destination port.


        ## Use Case

        **Logistics Tracking**

        Query the berthing time and departure time of the vessel at the departure port, as well as the Estimated Time of Arrival at the destination port. By coordinating with vessel berthing records or vessel arrival and departure event notifications, it is possible to track the arrival and departure times, berthing terminal information, and sailing status of each voyage of the vessel.


        ## Request Limits

        An API key must be created before using this service. API calls are subject to quota restrictions according to your permission type. To view your current service access permissions, please contact our support team: support@elaneglobal.com.


        ## Endpoint

        | Endpoint | HTTP Method |

        |----------|-------------|

        | `https://api.elaneglobal.com/v1/Prediction/ETA` | GET |


        ## Example API Call

        https://api.elaneglobal.com/v1/Prediction/ETA?key=1F6D701272402D1E7D8D316CCE519123&mmsi=477172700&port_code=CNSHG&speed=20


        **Note:**

        The key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to the domain api.elaneglobal.com.

        Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        To trial the service, please contact our support team: support@elaneglobal.com.'
      tags:
      - 4 Prediction Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: mmsi
        in: query
        description: 9-digit numeric code of MMSI
        required: true
        example: 477172700
        schema:
          type: integer
      - name: port_code
        in: query
        description: 'Standard 5-digit port code.

          When this parameter is not specified, the endpoint defaults to the next destination port declared in the vessel’s AIS message.'
        required: false
        example: CNSHG
        schema:
          type: string
      - name: speed
        in: query
        description: 'Sustained speed for the subsequent voyage, unit: knots (kn).

          When this parameter is not specified, , ETA is calculated using the vessel’s average sailing speed over the latest month (the average excludes speed data recorded while the vessel was at anchor in port areas).'
        required: false
        example: 20
        schema:
          type: number
      responses:
        '0':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      ship:
                        type: object
                        properties:
                          mmsi:
                            type: integer
                            description: 9-digit numeric code of MMSI
                          imo:
                            type: integer
                            description: 7-digit numeric code of IMO
                          ship_name:
                            type: string
                            description: Vessel name
                          call_sign:
                            type: string
                            description: 'Call Sign '
                          ship_type:
                            type: integer
                            description: 'Type of vessels: see Appendix for details. '
                        required:
                        - mmsi
                        - imo
                        - ship_name
                        - call_sign
                        - ship_type
                        x-apifox-orders:
                        - mmsi
                        - imo
                        - ship_name
                        - call_sign
                        - ship_type
                      location:
                        type: object
                        properties:
                          lng:
                            type: number
                            description: Longitude of the STS event position, under the WGS84 coordinate system
                          lat:
                            type: number
                            description: Latitude of the STS event position, under the WGS84 coordinate system
                          sea_area:
                            type: string
                            description: Name of the sea area
                          sea_area_code:
                            type: integer
                            description: Code of the sea area
                          sog:
                            type: integer
                            description: Real-time vessel speed over ground in knots; -1=invalid data
                        required:
                        - lng
                        - lat
                        - sog
                        - sea_area
                        - sea_area_code
                        x-apifox-orders:
                        - lng
                        - lat
                        - sog
                        - sea_area
                        - sea_area_code
                      preport:
                        type: object
                        properties:
                          port_code:
                            type: string
                            description: Standard 5-digit port code
                          port_cnname:
                            type: string
                            description: Chinese name of the port
                          port_name:
                            type: string
                            description: Name of the port
                          time_zone:
                            type: string
                            description: Time zone of the port’s location
                          port_country_code:
                            type: string
                            description: Standard code of the country/region where the port is located
                          port_country_name:
                            type: string
                            description: Name of the country/region where the port is located
                          port_country_cnname:
                            type: string
                            description: Chinese name of the country/region where the port is located
                          ata:
                            type: integer
                            description: Actual time of arrival at the port. Time zone varies based on the time_zone parameter.
                          atb:
                            type: integer
                            description: Actual time of berthing at the terminal. Time zone varies based on the time_zone parameter.
                          atd:
                            type: integer
                            description: Actual time of departure from the port. Time zone varies based on the time_zone parameter.
                        required:
                        - port_code
                        - port_cnname
                        - port_name
                        - time_zone
                        - port_country_code
                        - port_country_name
                        - port_country_cnname
                        - ata
                        - atb
                        - atd
                        x-apifox-orders:
                        - port_code
                        - port_cnname
                        - port_name
                        - time_zone
                        - port_country_code
                        - port_country_name
                        - port_country_cnname
                        - ata
                        - atb
                        - atd
                      nextport:
                        type: object
                        properties:
                          port_code:
                            type: string
                            description: Standard 5-digit port code
                          port_cnname:
                            type: string
                            description: Chinese name of the port
                          port_name:
                            type: string
                            description: Name of the port
                          time_zone:
                            type: integer
                            description: Time zone of the port’s location
                          port_country_code:
                            type: string
                            description: Standard code of the country/region where the port is located
                          port_country_name:
                            type: string
                            description: Name of the country/region where the port is located
                          port_country_cnname:
                            type: string
                            description: Chinese name of the country/region where the port is located
                          sailed_distance:
                            type: number
                            description: 'Distance already covered on the voyage. Unit: nautical miles (NM)'
                          sailed_time:
                            type: number
                            description: 'Elapsed sailing time for the voyage. Unit: hours'
                          ais_speed:
                            type: number
                            description: 'Average speed derived from AIS data. Unit: knots (kn)'
                          speed:
                            type: number
                            description: 'Average speed used for ETA computation.

                              If a value is provided for the speed request parameter, ETA is calculated using the input value; otherwise, the historical average speed from AIS is applied.

                              Unit: knots (kn)'
                          remaining_distance:
                            type: number
                            description: 'Estimated remaining voyage distance. Unit: nautical miles (NM).'
                          eta:
                            type: integer
                            description: Estimated Time of Arrival in Unix timestamp
                        required:
                        - port_code
                        - port_cnname
                        - port_name
                        - time_zone
                        - port_country_code
                        - port_country_name
                        - port_country_cnname
                        - sailed_distance
                        - sailed_time
                        - ais_speed
                        - speed
                        - eta
                        - remaining_distance
                        x-apifox-orders:
                        - port_code
                        - port_cnname
                        - port_name
                        - time_zone
                        - port_country_code
                        - port_country_name
                        - port_country_cnname
                        - sailed_distance
                        - sailed_time
                        - ais_speed
                        - speed
                        - eta
                        - remaining_distance
                    required:
                    - ship
                    - location
                    - preport
                    - nextport
                    x-apifox-orders:
                    - ship
                    - location
                    - preport
                    - nextport
                required:
                - status
                - msg
                - data
                x-apifox-orders:
                - status
                - msg
                - data
              example:
                status: 0
                msg: ''
                data:
                  ship:
                    mmsi: 477172700
                    imo: 9783538
                    ship_name: COSCO SHIPPING LIBRA
                    call_sign: VRRV4
                    ship_type: 71
                  location:
                    lng: 54.659382
                    lat: 24.813853
                    sog: 0
                    sea_area: Persian Gulf
                    sea_area_code: 4266
                  preport:
                    port_code: AEKHL
                    port_cnname: 哈里发港
                    port_name: Khalifa Port
                    time_zone: 4
                    port_country_code: AE
                    port_country_name: United Arab Emirates
                    port_country_cnname: 阿联酋
                    ata: 1746707992
                    atb: 1746716722
                    atd: 0

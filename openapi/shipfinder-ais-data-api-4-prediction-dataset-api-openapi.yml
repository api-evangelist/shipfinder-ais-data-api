                    lat: 22
                  - lng: 117
                    lat: 22.5
                  - lng: 122.5
                    lat: 28
                  - lng: 123
                    lat: 29
                  - lng: 123
                    lat: 30
                  - lng: 122.5
                    lat: 30.5

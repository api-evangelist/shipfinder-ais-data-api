                    lat: 31.1225
                  - lng: 121.87067
                    lat: 31.17867
                  - lng: 121.73775
                    lat: 31.28425
                  - lng: 121.58414
                    lat: 31.37979
          headers: {}
          x-apifox-name: success
      security: []
      x-apifox-folder: 4 Prediction Dataset
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/7948067/apis/api-431124483-run

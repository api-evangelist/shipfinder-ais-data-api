  /v1/Prediction/RoutePlanPointToPoint:
    get:
      summary: 4.1 Point-to-Point Route Planning
      deprecated: false
      description: '# 4.1 Point-to-Point Route Planning


        ## Description

        The Point-to-Point Route Planning queries the route plan between two coordinate waypoints, or from a departure waypoint to a destination port. Returns the total nautical distance of the route and the latitude/longitude coordinates of all waypoints along the route.


        ## Use Cases

        1. **Logistics Tracking**

        Save the planned fixed route and match it against the vessel’s real-time position to monitor whether the vessel sails in compliance with the predefined route. Route deviation alerts can be triggered by calculating the distance between the vessel’s real-time position and the planned path. You may also overlay historical vessel tracks with the planned route to visualize and compare discrepancies between the actual voyage track and the planned path.


        2. **Navigation Guidance**

        During vessel transit, retrieve the recommended sailing route in real time based on the vessel’s current position and destination port. The route can be combined with meteorological data for adverse weather avoidance, or used to plot simulated future sailing routes on electronic charts.


        ## Request Limits

        An API key must be created before using this service. API calls are subject to quota restrictions according to your permission type. To view your current service access permissions, please contact our support team: support@elaneglobal.com.


        ## Endpoint

        | Endpoint | HTTP Method |

        | --- | --- |

        | `https://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint` | GET |


        ## Example API Call

        https://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint?key=1F6D701272402D1E7D8D316CCE519123&start_point=113.571144,22.844316&end_point=121.58414,31.37979


        https://api.elaneglobal.com/v1/Prediction/RoutePlanPointToPoint?key=1F6D701272402D1E7D8D316CCE519123&start_point=113.571144,22.844316&end_port_code=CNQDG


        **Note:**

        The key 1F6D701272402D1E7D8D316CCE519123 is the official key of elaneglobal.com, bound to the domain api.elaneglobal.com.

        Users are not authorized to use this key for data access—utilizing it will return a status code 14, indicating an error in the source domain.

        To trial the service, please contact our support team: support@elaneglobal.com.'
      tags:
      - 4 Prediction Dataset
      parameters:
      - name: key
        in: query
        description: Your personal Shipfinderer API key to verify service permissions
        required: true
        example: 1F6D701272402D1E7D8D316CCE519123
        schema:
          type: string
      - name: start_point
        in: query
        description: Departure position, formatted as lng,lat (longitude first, latitude second), separated by an English comma.
        required: true
        example: 113.571144,22.844316
        schema:
          type: string
      - name: end_point
        in: query
        description: 'Destination position, formatted as lng,lat (longitude first, latitude second), separated by an English comma.

          Note: Mutually exclusive with end_port_code; one field is mandatory.

          If both fields are populated, route planning will be calculated based on end_port_code.'
        required: true
        example: 121.58414,31.37979
        schema:
          type: string
      - name: end_port_code
        in: query
        description: Standard 5-digit port code of the destination port.
        required: false
        schema:
          type: string
      - name: avoid
        in: query
        description: 'Waypoint IDs to be avoided; see Appendix for details

          Use commas to separate multiple IDs; leave blank for no avoidance.

          Maximum 10 avoidance waypoints per request.'
        required: false
        schema:
          type: string
      - name: through
        in: query
        description: 'Required waypoints along the route, formatted as lng,lat-lng,lat; use hyphens (-) to separate multiple waypoints.

          Leave blank if no mandatory waypoints are needed.

          Maximum 30 mandatory waypoints per request.'
        required: false
        schema:
          type: integer
      responses:
        '0':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      distance:
                        type: number
                        description: Total distance of the planned route in nautical miles (NM).
                      route:
                        type: array
                        items:
                          type: object
                          properties:
                            lng:
                              type: number
                              description: Waypoint longitude, WGS84 coordinate system
                            lat:
                              type: number
                              description: Waypoint latitude, WGS84 coordinate system
                          required:
                          - lng
                          - lat
                          x-apifox-orders:
                          - lng
                          - lat
                        description: Route Details
                    required:
                    - distance
                    - route
                    x-apifox-orders:
                    - distance
                    - route
                required:
                - status
                - msg
                - data
                x-apifox-orders:
                - status
                - msg
                - data
              example:
                status: 0
                msg: ''
                data:
                  distance: 915.22
                  route:
                  - lng: 113.571144
                    lat: 22.844316
                  - lng: 113.56867
                    lat: 22.82417
                  - lng: 113.59017
                    lat: 22.81067
                  - lng: 113.6135
                    lat: 22.78583

                    port_code: CNSHG
                    port_cnname: 上海
                    port_name: Shanghai
                    time_zone: 8
                    port_country_code: CN
                    port_country_name: China
                    port_country_cnname: 中国
                    sailed_distance: 0
                    sailed_time: 0
                    ais_speed: 7.67
                    speed: 20
                    eta: 1747770560
                    remaining_distance: 5608.53
          headers: {}
          x-apifox-name: success

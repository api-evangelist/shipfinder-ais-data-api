name: ShipFinder AIS Data API
description: >-
  ShipFinder, operated by Singapore-based ELANE GLOBAL PTE. LTD., publishes a REST/HTTP maritime data API that
  turns the global AIS feed into queryable vessel intelligence. Forty documented operations are organised into
  seven datasets: AIS (single, multi and fleet vessel positions, vessel search, vessels nearby, vessels in a
  zone, flag information), Voyage (port information, currently berthed and anchored vessels, expected arrivals),
  History (position tracks, ship-to-ship rendezvous, port-call records by vessel and by port), Prediction
  (point-to-point and port-to-port route planning with deviation-node constraints, and ETA), Meteorology (global
  tropical cyclones, tide gauge stations, marine weather), China region coastline navigational warnings, and an
  Event dataset whose fleet, geofence and speed-alert operations drive seven documented webhook push streams.
  Authentication is a single API key carried as the "key" query parameter (or body property on writes); every
  response is JSON in a {status, msg, data} envelope where status 0 means success and errors arrive with HTTP
  200. ShipFinder publishes per-endpoint OpenAPI 3.0.1 fragments on its documentation host plus an llms.txt
  index, and several controlled vocabularies (AIS vessel type, navigation status, sea areas, deviation nodes,
  AtoN types, service return codes).
